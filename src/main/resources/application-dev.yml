jwt:
  secretKey: ${JWT_SECRET}
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      flywaydb: DEBUG
      springframework.boot.autoconfigure.flyway: DEBUG
spring:
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never
