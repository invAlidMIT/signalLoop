jwt:
  secretKey: ${secretKey}
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
spring:
  application:
    name: system
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
